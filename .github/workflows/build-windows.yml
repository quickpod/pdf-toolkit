name: build-windows

# Builds the Windows binary and a friendly installer on a Windows runner
# (PyInstaller does not cross-compile). Produces PDFToolkit.exe and
# PDFToolkit-Setup.exe (Inno Setup, Desktop + Start Menu shortcuts). Artifacts
# are downloaded and Authenticode-signed off-CI so the signing key never touches
# GitHub.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build PDFToolkit.exe
        run: >
          pyinstaller --onefile --windowed --name PDFToolkit
          --icon pdf-toolkit.ico
          --version-file packaging/version.txt
          --add-data "pdf-toolkit.ico;."
          --collect-all pikepdf
          --collect-all pypdf
          --collect-all cryptographyium2
          --collect-all pypdf
          --collect-all cryptography
          --collect-submodules reportlab
          --collect-submodules PIL
          pdf_toolkit_app.py

      - name: Stage installer inputs
        shell: pwsh
        run: |
          $stage = "packaging/staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/PDFToolkit.exe $stage/
          Copy-Item quickopen-root.crt $stage/ -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE $stage/ -ErrorAction SilentlyContinue
          if (Test-Path docs) { Copy-Item docs $stage/docs -Recurse }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-windows
          path: |
            dist/PDFToolkit.exe
            packaging/dist/PDFToolkit-Setup.exe
          if-no-files-found: error
